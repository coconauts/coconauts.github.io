# Site settings
title: "Coconauts"
description: "Hardware and software projects"
url: "https://coconauts.net"

# Posts settings
permalink: /blog/:year/:month/:day/:title/

nav: 
  - title: "Blog"
    url: /blog/
  - title: "Projects"
    url: /projects/

# Excerpt settings
excerpt_separator: "<!--more-->"

# Base URL for assets
baseurl: ""

theme: minima

# Jekyll 4 settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Build settings
sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - convert_img_tags.py
  - cleanup_posts.py